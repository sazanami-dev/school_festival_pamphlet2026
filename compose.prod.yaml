# 本番用: docker compose -f compose.prod.yaml --env-file .env.production up -d --build
name: festival2026

services:
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # スタンプラリー（値は .env.production から渡す）
      RALLY_SECRET: ${RALLY_SECRET:-}
      CHECKPOINT_SECRET: ${CHECKPOINT_SECRET:-}
      STAFF_PIN: ${STAFF_PIN:-}
      ADMIN_PIN: ${ADMIN_PIN:-}
      RALLY_DATES: ${RALLY_DATES:-}
      RALLY_OPEN: ${RALLY_OPEN:-}
      RALLY_CLOSE: ${RALLY_CLOSE:-}
      RALLY_EXCHANGE_CLOSE: ${RALLY_EXCHANGE_CLOSE:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # 起動のたびに未適用のマイグレーションを流してから app を起動する
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Tokyo
    # 本番ではDBのポートを外部公開しない
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
