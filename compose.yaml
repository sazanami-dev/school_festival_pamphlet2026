# 開発用: docker compose up
name: festival2026-dev

services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Windows でファイル変更が反映されない対策（ポーリング間隔ms）。0 以下/空で無効
      NEXT_POLL_INTERVAL_MS: ${NEXT_POLL_INTERVAL_MS:-1000}
    volumes:
      - .:/app
      # ホスト(macOS)の node_modules / .next でコンテナ側を上書きしない
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Tokyo
    ports:
      # ホストから drizzle-kit / DBクライアントで接続できるよう公開
      - "${DB_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 以降は /var/lib/postgresql をマウントする
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
